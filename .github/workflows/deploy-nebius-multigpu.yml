name: Deploy Mutli GPU Job to Nebius

on:
  push:
    branches:
      - prod_deploy
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.gitignore'
      - '.github/workflows/*'
  workflow_dispatch:
    inputs:
      upscale_factor:
        description: 'Upscale factor'
        required: false
        default: '4.0'
        type: string
      gpu_platform:
        description: 'Nebius GPU Platform'
        required: false
        default: 'gpu-l40s-d'
        type: string
      gpu_preset:
        description: 'Nebius GPU Preset'
        required: false
        default: '2gpu-64vcpu-384gb'
        type: string
      disk_size:
        description: 'Disk size'
        required: false
        default: '250Gi'
        type: string
      timeout:
        description: 'Job execution timeout'
        required: false
        default: '4h'
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Fallbacks ensure git push events still use defaults when inputs are empty
  UPSCALE_FACTOR: ${{ inputs.upscale_factor || '4.0' }}
  GPU_PLATFORM: ${{ inputs.gpu_platform || 'gpu-l40s-d' }}
  GPU_PRESET: ${{ inputs.gpu_preset || '2gpu-64vcpu-384gb' }}
  DISK_SIZE: ${{ inputs.disk_size || '250Gi' }}
  JOB_TIMEOUT: ${{ inputs.timeout || '4h' }}

jobs:
  deploy-only:
    runs-on: ubuntu-latest

    steps:
      - name: Install Nebius CLI
        run: |
          curl -sSL https://storage.eu-north1.nebius.cloud/cli/install.sh | bash
          echo "$HOME/.nebius/bin" >> $GITHUB_PATH

      - name: Authenticate Nebius Service Account
        run: |
          mkdir -p ~/.nebius
          echo '${{ secrets.NEBIUS_SA_KEY }}' > ~/.nebius/sa-credentials.json
          nebius profile create \
            --endpoint api.nebius.cloud \
            --service-account-file ~/.nebius/sa-credentials.json \
            --profile sa-profile

      - name: Deploy Batch Job to Nebius AI Cloud
        run: |
          nebius ai job create \
            --name "sdxl-upscale-job-$(date +%s)" \
            --parent-id "${{ secrets.NEBIUS_PROJECT_ID }}" \
            --image "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" \
            --container-command "/app/entrypoint.sh" \
            --env MODE=batch \
            --env UPSCALE_FACTOR="${{ env.UPSCALE_FACTOR }}" \
            --env S3_BUCKET_NAME="${{ secrets.S3_BUCKET_NAME }}" \
            --env S3_ACCESS_KEY="${{ secrets.S3_ACCESS_KEY }}" \
            --env S3_SECRET_KEY="${{ secrets.S3_SECRET_KEY }}" \
            --env S3_ENDPOINT_URL="https://storage.eu-north1.nebius.cloud" \
            --platform "${{ env.GPU_PLATFORM }}" \
            --preset "${{ env.GPU_PRESET }}" \
            --disk-size "${{ env.DISK_SIZE }}" \
            --subnet-id "${{ secrets.NEBIUS_SUBNET_ID }}" \
            --preemptible \
            --timeout "${{ env.JOB_TIMEOUT }}"